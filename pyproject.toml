[project]
name = "protocol215"
version = "0.1.0"
description = "Protocol 215: Clinical Amendment Preflight — synthetic proof of concept"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "google-adk==2.6.2",
  "google-genai>=1.0.0",
  "tenacity>=9.0.0",
  "structlog>=24.4.0",
  "httpx>=0.27.0",
  "reportlab>=5.0.1",
  "pypdf>=6.16.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "coverage>=7.6.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "types-requests>=2.32.0",
]
cloud = [
  "google-cloud-storage>=2.18.0",
  "google-cloud-firestore>=2.19.0",
  "google-cloud-pubsub>=2.27.0",
  "google-cloud-logging>=3.11.0",
  "google-auth>=2.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/protocol215"]

[tool.hatch.build.targets.wheel.force-include]
"src/protocol215/py.typed" = "protocol215/py.typed"

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "apps", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
packages = ["protocol215"]
mypy_path = "src"
exclude = ["_bmad/", "_bmad-output/", "apps/web/", ".tools/"]

[[tool.mypy.overrides]]
module = [
  "google.*",
  "google.cloud.*",
  "google.oauth2.*",
  "google.auth.*",
  "reportlab.*",
  "pypdf.*",
]
ignore_missing_imports = true
disable_error_code = ["attr-defined"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = [
  "live_gemini: requires RUN_LIVE_GEMINI_TESTS=1 and Vertex credentials",
  "live_cloud: requires RUN_LIVE_CLOUD_TESTS=1 and real GCP project (not run in CI)",
]
addopts = [
  "--cov=protocol215",
  "--cov-report=term-missing",
  "--cov-fail-under=40",
]

[tool.coverage.run]
branch = true
source = ["protocol215"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
]

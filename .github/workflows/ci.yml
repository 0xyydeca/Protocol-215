name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python-and-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.4"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Python dependencies
        run: uv sync --extra dev

      - name: Ruff format check
        run: uv run ruff format --check src apps/api apps/worker tests

      - name: Ruff lint
        run: uv run ruff check src apps/api apps/worker tests

      - name: Mypy
        run: uv run mypy src/protocol215

      - name: Pytest
        run: uv run pytest
        env:
          APP_ENV: test
          OBJECT_STORE_BACKEND: local
          STATE_STORE_BACKEND: memory
          EVENT_BUS_BACKEND: inprocess
          GEMINI_BACKEND: fake

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Frontend tests
        working-directory: apps/web
        run: npm test -- --run

      - name: Frontend build
        working-directory: apps/web
        run: npm run build
